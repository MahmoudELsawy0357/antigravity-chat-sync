<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Antigravity Chat Sync — Mahmoud Elsawy Identity Mark">
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <linearGradient id="sync-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="50%" stop-color="#00dc82" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <radialGradient id="ambient-glow" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#00dc82" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <pattern id="bp-grid" width="16" height="16" patternUnits="userSpaceOnUse" x="22.5" y="22.5">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#21262d" stroke-width="1" />
    </pattern>
    <radialGradient id="grid-fade" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="bp-mask">
      <rect x="10" y="10" width="108" height="108" rx="22" fill="url(#grid-fade)" />
    </mask>
    <clipPath id="tile-clip">
      <rect x="10" y="10" width="108" height="108" rx="22" />
    </clipPath>
  </defs>

  <!-- Outer Architectural Tile (~10% transparent margin for Antigravity UI) -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.5" />

  <g clip-path="url(#tile-clip)">
    <!-- Masked Blueprint Grid & Subtle Ambient Glow -->
    <rect x="10" y="10" width="108" height="108" fill="url(#bp-grid)" mask="url(#bp-mask)" />
    <circle cx="64" cy="60" r="46" fill="url(#ambient-glow)" />

    <!-- Inner Blueprint Frame -->
    <rect x="22.5" y="22.5" width="83" height="83" fill="none" stroke="#21262d" stroke-width="1" />

    <!-- Precision Corner Crosshairs (+) -->
    <g stroke="#484f58" stroke-width="1.2" stroke-linecap="square">
      <path d="M 18.5 22.5 H 26.5 M 22.5 18.5 V 26.5" />
      <path d="M 101.5 22.5 H 109.5 M 105.5 18.5 V 26.5" />
      <path d="M 18.5 105.5 H 26.5 M 22.5 101.5 V 109.5" />
      <path d="M 101.5 105.5 H 109.5 M 105.5 101.5 V 109.5" />
    </g>

    <!-- Live Status Telemetry Pulse Dot -->
    <circle cx="95" cy="32" r="2.8" fill="#3fb950" />
    <circle cx="95" cy="32" r="5.2" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.45" />

    <!-- Mahmoud 'M' Geometric Monogram (Machine A <-> Vault <-> Machine B) -->
    <path
      d="M 39 74 V 42 L 64 64 L 89 42 V 74"
      fill="none"
      stroke="#f0f6fc"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bidirectional Emerald-to-Blue Sync Rail -->
    <line x1="42" y1="88" x2="86" y2="88" stroke="url(#sync-beam)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 48.5 82.5 L 42 88 L 48.5 93.5" fill="none" stroke="#3fb950" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 79.5 82.5 L 86 88 L 79.5 93.5" fill="none" stroke="#58a6ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
