<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 208" width="100%" role="img" aria-label="antigravity-chat-sync — By Mahmoud Elsawy">
  <defs>
    <pattern id="grid-dark" width="36" height="36" patternUnits="userSpaceOnUse" x="24.5" y="16.5">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#21262d" stroke-width="1" />
    </pattern>
    <radialGradient id="fade-mask-grad" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask">
      <rect width="848" height="208" fill="url(#fade-mask-grad)" />
    </mask>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mark-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="sync-rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="50%" stop-color="#00dc82" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <rect width="848" height="208" fill="#0d1117" />
  <rect width="848" height="208" fill="url(#grid-dark)" mask="url(#grid-mask)" />

  <!-- Architectural Frame + Animated Border Beam -->
  <rect x="24.5" y="16.5" width="799" height="175" fill="none" stroke="#21262d" stroke-width="1" />
  <rect x="24.5" y="16.5" width="799" height="175" fill="none" stroke="url(#beam-grad)" stroke-width="1.2" stroke-dasharray="160 1788">
    <animate attributeName="stroke-dashoffset" from="1948" to="0" dur="9s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Crosshairs (+) -->
  <g stroke="#484f58" stroke-width="1">
    <path d="M 19.5 16.5 L 29.5 16.5 M 24.5 11.5 L 24.5 21.5" />
    <path d="M 818.5 16.5 L 828.5 16.5 M 823.5 11.5 L 823.5 21.5" />
    <path d="M 19.5 191.5 L 29.5 191.5 M 24.5 186.5 L 24.5 196.5" />
    <path d="M 818.5 191.5 L 828.5 191.5 M 823.5 186.5 L 823.5 196.5" />
  </g>

  <!-- Signature 'M' + Sync Identity Tile -->
  <g transform="translate(50, 52)">
    <rect x="0.5" y="0.5" width="103" height="103" rx="20" fill="url(#mark-bg)" stroke="#30363d" stroke-width="1.2" />
    <rect x="11.5" y="11.5" width="81" height="81" fill="none" stroke="#21262d" stroke-width="1" />
    <g stroke="#484f58" stroke-width="1">
      <path d="M 8.5 11.5 H 14.5 M 11.5 8.5 V 14.5" />
      <path d="M 89.5 11.5 H 95.5 M 92.5 8.5 V 14.5" />
      <path d="M 8.5 92.5 H 14.5 M 11.5 89.5 V 95.5" />
      <path d="M 89.5 92.5 H 95.5 M 92.5 89.5 V 95.5" />
    </g>
    <path d="M 28 63 V 32 L 52 53 L 76 32 V 63" fill="none" stroke="#f0f6fc" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="31" y1="76" x2="73" y2="76" stroke="url(#sync-rail)" stroke-width="3" stroke-linecap="round" />
    <path d="M 37 71 L 31 76 L 37 81" fill="none" stroke="#3fb950" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 67 71 L 73 76 L 67 81" fill="none" stroke="#58a6ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center Editorial Column -->
  <g transform="translate(176, 42)">
    <rect x="0.5" y="0.5" width="256" height="23" rx="11.5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="none" stroke="#3fb950" stroke-width="1">
      <animate attributeName="r" values="3.5;8.5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.75;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="14" cy="12" r="3.2" fill="#3fb950" />
    <text x="25" y="15.5" class="mono" font-size="10.5" fill="#8b949e">OPEN SOURCE · MAHMOUD ELSAWY</text>
  </g>

  <text x="176" y="106" class="mono" font-size="26" font-weight="700" fill="#f0f6fc" letter-spacing="-0.6">antigravity-chat-sync</text>
  <text x="176" y="135" class="sans" font-size="13.5" fill="#8b949e">
    Multi-agent AI session archiver, sync engine &amp; cross-agent handoff.
  </text>
  <text x="176" y="157" class="sans" font-size="12.5" fill="#6e7681">
    Antigravity · Claude Code · Codex · Cursor — zero LFS &amp; byte-safe redaction.
  </text>

  <!-- Vertical Blueprint Divider -->
  <line x1="618.5" y1="42" x2="618.5" y2="166" stroke="#21262d" stroke-width="1" />

  <!-- Right Telemetry Column -->
  <text x="644" y="56" class="mono" font-size="10.5" fill="#6e7681" letter-spacing="1">TOOLKIT · V2.0</text>

  <text x="644" y="96" class="sans" font-size="21" font-weight="700" fill="#f0f6fc" letter-spacing="-0.4">4 Agents</text>
  <text x="644" y="113" class="mono" font-size="10" fill="#8b949e" letter-spacing="0.4">AGY · CLAUDE · CODEX · CURSOR</text>

  <text x="644" y="146" class="mono" font-size="19" font-weight="700" fill="#f0f6fc" letter-spacing="-0.4">/chat-sync</text>
  <text x="644" y="163" class="mono" font-size="10" fill="#6e7681" letter-spacing="0.4">UNIFIED SKILL + HANDOFF</text>
</svg>
