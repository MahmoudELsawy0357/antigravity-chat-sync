name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install TypeScript & Bun type definitions
        run: bun add -d @types/bun typescript

      - name: Typecheck TypeScript (strict)
        run: bun x tsc --noEmit

      - name: Run unit test suite
        run: bun test
